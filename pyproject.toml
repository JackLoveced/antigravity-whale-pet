[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-whale-pet"
version = "1.0.0"
description = "DeepSeek 鲸鱼娘（吃白饭的蓝色大肥鱼）桌面宠物 — 与 Google Antigravity 实时工作状态深度联动"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [
  {name = "antigravity-whale-pet contributors"}
]
keywords = ["antigravity", "desktop-pet", "deepseek", "whale-girl", "pyqt6", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PyQt6>=6.6.0",
  "av>=12.0.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
agy-pet = "antigravity_whale_pet.cli:main"

[project.gui-scripts]
agy-petw = "antigravity_whale_pet.app:main"

[project.urls]
Homepage = "https://github.com/JackLoveced/antigravity-whale-pet"
Issues = "https://github.com/JackLoveced/antigravity-whale-pet/issues"
UpstreamAssets = "https://github.com/PC2005-cloud/dsh-pet"

[tool.setuptools.packages.find]
where = ["src"]
